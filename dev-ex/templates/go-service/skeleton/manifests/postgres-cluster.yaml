# CloudNativePG Postgres instance dedicated to this service.
# Creates a Secret named ${{ values.name }}-app with username/password/dbname
# for the 'app' database — consumed by the Deployment env vars.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
spec:
  instances: 1
  bootstrap:
    initdb:
      database: app
      owner: app
  storage:
    size: 1Gi
    # storageClass: <default is used if unset>

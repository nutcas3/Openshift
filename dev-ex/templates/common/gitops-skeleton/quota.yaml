---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ${{ values.namespace }}-quota
  namespace: ${{ values.namespace }}
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 8Gi
    limits.cpu: '8'
    limits.memory: 16Gi
    pods: '30'
    services: '20'
    persistentvolumeclaims: '10'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ${{ values.namespace }}-limits
  namespace: ${{ values.namespace }}
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: '2'
        memory: 4Gi

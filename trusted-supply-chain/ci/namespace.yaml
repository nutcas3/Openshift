---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-pipelines
  labels:
    openshift.io/cluster-monitoring: "true"
---
# Builds push to the internal registry in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-ci
  namespace: ci-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-ci-image-builder
  namespace: ci-pipelines
subjects:
  - kind: ServiceAccount
    name: pipeline-ci
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: system:image-builder
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data
  namespace: ci-pipelines
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

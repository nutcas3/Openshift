apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-runner-sa
  namespace: tenant-team-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-runner
  namespace: tenant-team-a
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: [pods, deployments, jobs, pods/exec, pods/log, events]
    verbs: [get, list, create, delete, patch, update, watch]
  - apiGroups: ["litmuschaos.io"]
    resources: [chaosengines, chaosexperiments, chaosresults]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-runner
  namespace: tenant-team-a
subjects:
  - kind: ServiceAccount
    name: chaos-runner-sa
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: chaos-runner

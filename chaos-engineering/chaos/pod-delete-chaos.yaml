apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: backend-pod-failure-experiment
  namespace: tenant-team-a
spec:
  appinfo:
    appkind: deployment
    applabel: app=backend-service
  chaosServiceAccount: chaos-runner-sa
  engineState: active
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: '30'
            - name: CHAOS_INTERVAL
              value: '10'
            - name: FORCE
              value: 'true'
            - name: TARGET_PODS
              value: ''

# SealedSecret example — ciphertext generated by kubeseal against the
# DEV cluster's public cert (see argocd/README.md in multi-cluster-gitops).
# Replace the encryptedData values with real sealed output; never commit
# the plaintext Secret.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: example-app-db
  namespace: example-app-dev
spec:
  encryptedData:
    username: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...   # sealed value
    password: AgBx0f9K2mR7vNq1TzYbW8cQeL5dP6oA...   # sealed value
  template:
    metadata:
      name: example-app-db
      namespace: example-app-dev
    type: Opaque

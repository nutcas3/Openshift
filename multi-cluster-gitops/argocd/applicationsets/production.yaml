apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads-production
  namespace: openshift-gitops
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/YOUR_GITHUB_ORG/fleet-workloads.git
        revision: main
        files:
          - path: envs/production/*/config.json
  template:
    metadata:
      name: '{{ .app }}-production'
      labels:
        env: production
    spec:
      project: production
      source:
        repoURL: https://github.com/YOUR_GITHUB_ORG/fleet-workloads.git
        targetRevision: main
        path: '{{ .path }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true

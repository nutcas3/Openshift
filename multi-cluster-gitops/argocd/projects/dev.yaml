apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: openshift-gitops
spec:
  description: Dev environment workloads and PR previews
  sourceRepos:
    - https://github.com/YOUR_GITHUB_ORG/fleet-workloads.git
  destinations:
    # In-cluster for single-cluster setups; add the registered dev-cluster
    # URL (from `argocd cluster list`) for true multi-cluster.
    - server: https://kubernetes.default.svc
      namespace: '*-dev'
    - server: https://kubernetes.default.svc
      namespace: 'preview-*'
  clusterResourceWhitelist:
    - group: '*'
      kind: Namespace

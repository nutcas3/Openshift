# Single bootstrap Application — syncs argocd/ recursively (projects +
# ApplicationSets). Everything below this is generated; this is the only
# manifest ever applied by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_ORG/multi-cluster-gitops.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

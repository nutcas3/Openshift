# Developers declare WHAT secret they need; ESO fetches it from Vault.
# The raw credential never touches git or the developer's terminal.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: tenant-team-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-app-secret        # native Secret created in tenant-team-a
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/data/team-a/database
        property: password
    - secretKey: DB_USERNAME
      remoteRef:
        key: secret/data/team-a/database
        property: username

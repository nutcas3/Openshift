# ClusterSecretStore for Vault — ESO authenticates with Vault's Kubernetes
# auth method using a ServiceAccount token. Prereqs on the Vault side:
#   vault auth enable kubernetes
#   vault write auth/kubernetes/config \
#     kubernetes_host=https://api.<cluster>:6443 kubernetes_ca_cert=@ca.crt
#   vault policy write external-secrets - <<'HCL'
#     path "secret/data/*" { capabilities = ["read"] }
#   HCL
#   vault write auth/kubernetes/role/external-secrets \
#     bound_service_account_names=eso-vault-auth \
#     bound_service_account_namespaces=external-secrets \
#     policies=external-secrets ttl=24h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: eso-vault-auth
            # v1 audit token review needs this SA to have
            # system:auth-delegator — bind TokenReviews:
            # oc adm policy add-cluster-role-to-user system:auth-delegator \
            #   system:serviceaccount:external-secrets:eso-vault-auth
